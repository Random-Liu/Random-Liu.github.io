site_name: "Random-Liu 的笔记"
site_url: https://random-liu.github.io/

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.follow
    - content.code.copy
    - navigation.tags
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

markdown_extensions:
  - toc:
      toc_depth: 3
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - "中文版":
    - index.cn.md
    - "体系化专题":
      - "LLM 从原理到生产级推理": https://random-liu.github.io/llm-inference-principle-to-production/
    - "技术笔记":
      - "示例笔记": notes/example_note.cn.md
      - "敬请期待": notes/coming_soon.cn.md
  - "English":
    - index.md
    - "Structured Projects":
      - "LLM Inference": https://random-liu.github.io/llm-inference-principle-to-production/
    - "Tech Notes":
      - "Example Note": notes/example_note.md
      - "Coming Soon": notes/coming_soon.md


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Random-Liu
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/liu-lantao-96a97351/
